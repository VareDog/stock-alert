<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票价格提醒</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111318; color: #e5e7eb; font-family: system-ui, sans-serif; padding: 10px; }
  h1 { font-size: 18px; padding: 4px 0; }
  .hint { color: #9ca3af; font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
  #lock { max-width: 360px; margin: 120px auto; text-align: center; }
  #lock input { width: 100%; padding: 10px; font-size: 15px; background: #1c1f26; border: 1px solid #374151; color: #fff; border-radius: 8px; text-align: center; }
  #lock button { margin-top: 12px; width: 100%; padding: 10px; }
  .card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .card.hit { border-color: #ef4444; background: #2a1215; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  input.code { width: 96px; padding: 3px 6px; background: #1c1f26; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 13px; }
  .name { font-size: 13px; color: #d1d5db; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 6em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #374151; flex-shrink: 0; }
  .card.hit .dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .price { margin-left: auto; font-size: 17px; font-weight: 700; color: #fbbf24; }
  .pair { display: flex; gap: 6px; margin-top: 6px; }
  .block { flex: 1; display: flex; align-items: center; gap: 5px; background: #22262e; padding: 4px 6px; border-radius: 6px; }
  .block.hitb { background: #3f1d1d; }
  .block .tag { font-size: 12px; color: #9ca3af; flex-shrink: 0; }
  .block input[type=number] { flex: 1; min-width: 0; width: 100%; padding: 3px 4px; background: #1c1f26; border: 1px solid #374151; color: #fff; border-radius: 5px; font-size: 13px; text-align: center; }
  .block input[type=checkbox] { accent-color: #ef4444; flex-shrink: 0; }
  .card-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: #9ca3af; }
  input.band { width: 44px; padding: 3px 4px; background: #1c1f26; border: 1px solid #374151; color: #fff; border-radius: 5px; font-size: 12px; text-align: center; }
  select.chan { padding: 3px 4px; background: #1c1f26; border: 1px solid #374151; color: #fff; border-radius: 5px; font-size: 12px; flex: 1; max-width: 90px; }
  .del { margin-left: auto; color: #ef4444; cursor: pointer; padding: 2px 6px; font-size: 12px; }
  button { background: #d97706; border: none; color: #fff; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.ghost { background: #374151; }
  .toolbar { display: flex; gap: 8px; margin: 8px 0; }
  .err { color: #ef4444; font-size: 12px; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>

<div id="lock">
  <h1>股票价格提醒</h1>
  <p class="hint" style="margin-top:12px">输入访问口令</p>
  <input id="keyInput" type="password" placeholder="口令">
  <button onclick="unlock()">进入</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="app" style="display:none">
  <h1>股票价格提醒 <span class="dot" id="gdot" style="display:inline-block;vertical-align:middle"></span></h1>
  <p class="hint">红卡 = 满足提醒条件；检查时段 9:15-11:30 / 13:00-15:30；代码如 sh600000 / sz000001 / bj430047</p>
  <div class="toolbar">
    <button onclick="addRow()">+ 添加</button>
    <button class="ghost" onclick="refreshPrices(true)">刷新价格</button>
  </div>
  <div id="cards"></div>
  <div class="err" id="err"></div>
</div>

<script>
let KEY = localStorage.getItem('alert_key') || '';
let rows = [];

if (KEY) { tryLoad(); }

function unlock() {
  KEY = document.getElementById('keyInput').value.trim();
  tryLoad();
}

function showLockErr(msg) {
  document.getElementById('lockErr').textContent = msg;
}

async function tryLoad() {
  try {
    const res = await fetch('/api/rows', { headers: { 'X-Alert-Key': KEY } });
    if (res.status === 401) { showLockErr('口令错误'); return; }
    localStorage.setItem('alert_key', KEY);
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const data = await res.json();
    rows = data.rows || [];
    render();
  } catch (e) {
    showLockErr('网络错误，稍后重试');
  }
}

function render() {
  const box = document.getElementById('cards');
  box.innerHTML = '';
  for (const r of rows) {
    const card = document.createElement('div');
    card.className = 'card' + (r.triggered ? ' hit' : '');
    card.id = 'card-' + r.id;
    card.innerHTML = `
      <div class="card-top">
        <span class="dot"></span>
        <input class="code" value="${esc(r.code)}" onchange="upd(${r.id},'code',this.value)">
        <span class="name">${esc(r.name)}</span>
        <span class="price">${r.current_price || '-'}</span>
      </div>
      <div class="pair">
        <div class="block ${r.triggered && r.enabled_buy ? 'hitb' : ''}">
          <span class="tag">买</span>
          <input type="number" step="0.01" placeholder="买价" value="${r.buy_price || ''}" onchange="upd(${r.id},'buy_price',this.value)">
          <input type="checkbox" title="买提醒" ${r.enabled_buy ? 'checked' : ''} onchange="upd(${r.id},'enabled_buy',this.checked)">
        </div>
        <div class="block ${r.triggered && r.enabled_sell ? 'hitb' : ''}">
          <span class="tag">卖</span>
          <input type="number" step="0.01" placeholder="卖价" value="${r.sell_price || ''}" onchange="upd(${r.id},'sell_price',this.value)">
          <input type="checkbox" title="卖提醒" ${r.enabled_sell ? 'checked' : ''} onchange="upd(${r.id},'enabled_sell',this.checked)">
        </div>
      </div>
      <div class="card-foot">
        <span>幅度</span><input class="band" type="number" step="1" min="1" max="50" value="${Math.round((r.band || 0.1) * 100)}" onchange="upd(${r.id},'band',this.value)"><span>%</span>
        <select class="chan" onchange="upd(${r.id},'channel',this.value)">
          <option value="wx" ${r.channel==='wx'?'selected':''}>微信</option>
          <option value="email" ${r.channel==='email'?'selected':''}>邮件</option>
          <option value="both" ${r.channel==='both'?'selected':''}>双通道</option>
        </select>
        <span class="del" onclick="delRow(${r.id})">删除</span>
      </div>`;
    box.appendChild(card);
  }
  refreshPrices();
}

function esc(s) { return String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

async function upd(id, field, value) {
  const body = {};
  if (field === 'band') body.band = Math.min(50, Math.max(1, parseFloat(value) || 10)) / 100;
  else if (field === 'buy_price' || field === 'sell_price') body[field] = parseFloat(value) || 0;
  else if (field === 'enabled_buy' || field === 'enabled_sell') body[field] = value ? 1 : 0;
  else body[field] = String(value).trim();
  const res = await fetch('/api/rows/' + id, {
    method: 'PUT',
    headers: { 'X-Alert-Key': KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) { document.getElementById('err').textContent = data.error; return; }
  const i = rows.findIndex(r => r.id === id);
  if (i >= 0) rows[i] = data.row;
  render();
}

async function addRow() {
  const code = prompt('输入股票代码（如 sh600000）：');
  if (!code) return;
  const res = await fetch('/api/rows', {
    method: 'POST',
    headers: { 'X-Alert-Key': KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code.trim() })
  });
  const data = await res.json();
  if (data.error) { document.getElementById('err').textContent = data.error; return; }
  rows.push(data.row);
  render();
}

async function delRow(id) {
  if (!confirm('删除这一行？')) return;
  await fetch('/api/rows/' + id, { method: 'DELETE', headers: { 'X-Alert-Key': KEY } });
  rows = rows.filter(r => r.id !== id);
  render();
}

async function loadRows() {
  const res = await fetch('/api/rows', { headers: { 'X-Alert-Key': KEY } });
  const data = await res.json();
  rows = data.rows || [];
  render();
}

async function refreshPrices(manual) {
  try {
    const res = await fetch('/api/refresh', { headers: { 'X-Alert-Key': KEY } });
    if (!res.ok) return;
    const data = await res.json();
    let anyHit = false;
    rows.forEach(r => {
      const q = data.quotes[r.code.toLowerCase()];
      if (!q) return;
      r.current_price = q.price;
      r.triggered = q.hit ? 1 : 0;
      const card = document.getElementById('card-' + r.id);
      if (!card) return;
      if (q.name) card.querySelector('.name').textContent = q.name;
      card.querySelector('.price').textContent = q.price;
      card.classList.toggle('hit', !!q.hit);
      const blocks = card.querySelectorAll('.block');
      blocks[0].classList.toggle('hitb', !!q.hit && r.enabled_buy === 1);
      blocks[1].classList.toggle('hitb', !!q.hit && r.enabled_sell === 1);
      if (q.hit) anyHit = true;
    });
    const gdot = document.getElementById('gdot');
    gdot.style.background = anyHit ? '#ef4444' : '#374151';
    gdot.style.boxShadow = anyHit ? '0 0 8px #ef4444' : 'none';
  } catch (e) {}
}

setInterval(refreshPrices, 60000);
</script>
</body>
</html>
