name: stock-alert-ci

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type check
        run: |
          npm install
          npm run check

      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler d1 execute stock-alert --remote --file=schema.sql -y || true
          npx wrangler deploy
